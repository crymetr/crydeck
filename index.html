<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>CryDeck</title>
<style>
  :root {
    --bg: #0d0d10; --bg2: #16161c; --bg3: #1c1c24; --line: #26262f;
    --fg: #d8d8de; --dim: #8a8a96; --accent: #4d9fff; --changed: #e2b93d; --blocked: #e5484d;
    --tree-w: 230px; --preview-w: 420px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 12px/1.45 "Segoe UI", system-ui, sans-serif; overflow: hidden;
    user-select: none; }
  #app { display: grid; height: 100%;
    grid-template-rows: 34px 1fr 26px;
    grid-template-columns: var(--tree-w) 4px 1fr 4px var(--preview-w);
    grid-template-areas:
      "tabs tabs tabs tabs tabs"
      "tree s1 term s2 prev"
      "stat stat stat stat stat"; }

  /* ---- tabs ---- */
  #tabs { grid-area: tabs; display: flex; align-items: stretch; gap: 2px;
    background: var(--bg2); border-bottom: 1px solid var(--line); padding: 4px 6px 0; }
  .tab { display: flex; align-items: center; gap: 7px; padding: 0 10px;
    background: var(--bg3); border: 1px solid var(--line); border-bottom: none;
    border-radius: 6px 6px 0 0; cursor: pointer; max-width: 190px; color: var(--dim); }
  .tab.active { background: var(--bg); color: var(--fg); border-color: #35353f; }
  .tab .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tab .close { border: none; background: none; color: inherit; cursor: pointer;
    padding: 0 2px; font-size: 13px; border-radius: 3px; }
  .tab .close:hover { background: #3a2020; color: #ff7b7b; }
  .tab .badge { width: 7px; height: 7px; border-radius: 50%; display: none; flex: 0 0 auto; }
  .tab .schedicon { display: none; font-size: 10px; opacity: .8; }
  .tab.sched .schedicon { display: inline; }
  .tab.busy .badge { display: inline-block; background: var(--accent); animation: tabpulse 1.2s ease-in-out infinite; }
  .tab.attn .badge { display: inline-block; background: var(--changed); }
  /* Claude rang for you (permission / waiting): red, pulsing, most urgent. */
  .tab.blocked .badge { display: inline-block; background: var(--blocked); animation: tabpulse 1.2s ease-in-out infinite; }
  @keyframes tabpulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
  #newtab { border: 1px dashed var(--line); background: none; color: var(--dim);
    border-radius: 6px 6px 0 0; padding: 0 12px; cursor: pointer; font: inherit; }
  #newtab:hover { color: var(--fg); border-color: #45454f; }
  #empty { grid-area: term; display: flex; flex-direction: column; gap: 10px;
    align-items: center; justify-content: center; color: var(--dim);
    position: relative; z-index: 5; }
  #empty button { font: inherit; padding: 8px 18px; border-radius: 6px;
    border: 1px solid #35353f; background: var(--bg3); color: var(--fg); cursor: pointer; }

  /* ---- tree ---- */
  #tree { grid-area: tree; overflow: auto; background: var(--bg2);
    border-right: 1px solid var(--line); padding: 4px 0; }
  #tree .hdr { display: flex; align-items: center; padding: 2px 8px 6px;
    color: var(--dim); }
  #tree .hdr .root { overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    direction: rtl; text-align: left; flex: 1; }
  #tree .hdr button { background: none; border: none; color: var(--dim);
    cursor: pointer; font-size: 13px; padding: 0 4px; }
  #tree .hdr button:hover { color: var(--fg); }
  .node { cursor: pointer; }
  .node > .row { display: flex; align-items: center; gap: 5px; padding: 1px 6px;
    white-space: nowrap; }
  .node > .row:hover { background: #20202a; }
  .node > .row.sel { background: #24304a; }
  .node .arrow { width: 10px; color: var(--dim); font-size: 9px; flex: 0 0 auto; }
  .node .ico { flex: 0 0 auto; opacity: .8; }
  .node .label { overflow: hidden; text-overflow: ellipsis; }
  .node.changed > .row .label { color: var(--changed); }
  .node.changed > .row .label::after { content: " ●"; font-size: 8px; }
  .node.seen > .row .label { color: #7fae7f; }
  .node.seen > .row .label::after { content: " ●"; font-size: 8px; opacity: .55; }
  .node.git > .row .label::after { content: " ●"; font-size: 8px; color: #6f8fd0; opacity: .7; }
  .kids { padding-left: 14px; }

  /* ---- terminal ---- */
  #termhost { grid-area: term; position: relative; min-width: 0; min-height: 0; }
  .termbox { position: absolute; inset: 0; padding: 4px 0 0 6px; display: none; }
  .termbox.active { display: block; }

  /* ---- splitters ---- */
  #s1 { grid-area: s1; } #s2 { grid-area: s2; }
  .split { cursor: col-resize; background: var(--line); }
  .split:hover { background: var(--accent); }

  /* ---- preview ---- */
  #preview { grid-area: prev; display: flex; flex-direction: column;
    background: var(--bg2); border-left: 1px solid var(--line); min-width: 0; }
  #pv-modes { display: flex; gap: 2px; padding: 5px 6px; border-bottom: 1px solid var(--line); }
  #pv-modes button { flex: 1; font: inherit; padding: 3px 0; background: var(--bg3);
    color: var(--dim); border: 1px solid var(--line); border-radius: 4px; cursor: pointer; }
  #pv-modes button.on { color: var(--fg); background: #24304a; border-color: #35507a; }
  #pv-modes #shellToggle { flex: 0 0 auto; padding: 3px 10px; }
  #pv-body { flex: 1; min-height: 0; position: relative; }
  .pv-view { position: absolute; inset: 0; display: none; overflow: auto; }
  .pv-view.on { display: flex; flex-direction: column; }
  #pv-file { user-select: text; }
  #pv-file .path { display: flex; align-items: center; gap: 8px; padding: 4px 8px;
    color: var(--dim); border-bottom: 1px solid var(--line); flex: 0 0 auto; }
  #pv-file .path .p { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; direction: rtl; text-align: left; }
  #pv-file .renderbtn { flex: 0 0 auto; font: 11px system-ui; padding: 2px 9px;
    background: var(--bg3); border: 1px solid var(--line); border-radius: 4px;
    color: var(--fg); cursor: pointer; }
  #pv-file .renderbtn:hover { border-color: var(--accent); }
  #pv-file .content { flex: 1; overflow: auto; }
  #pv-file .viewsel { display: flex; gap: 2px; padding: 4px 6px; flex: 0 0 auto;
    border-bottom: 1px solid var(--line); }
  #pv-file .viewsel button { flex: 1; font: inherit; padding: 2px 0; background: var(--bg3);
    color: var(--dim); border: 1px solid var(--line); border-radius: 4px; cursor: pointer; }
  #pv-file .viewsel button.on { color: var(--fg); background: #24304a; border-color: #35507a; }
  #pv-file pre.diff .dadd { color: #9fce9f; background: rgba(46,125,50,.14); display: inline-block; width: 100%; }
  #pv-file pre.diff .ddel { color: #d09090; background: rgba(198,40,40,.12); display: inline-block; width: 100%; }
  #pv-file pre.diff .dhunk { color: #6f8fd0; }
  #pv-file pre.diff .dmeta { color: var(--dim); }
  #pv-file pre { margin: 0; padding: 8px; font: 11.5px/1.5 "Cascadia Mono", Consolas, monospace;
    white-space: pre; }
  #pv-file .md { padding: 10px 14px; font-size: 13px; }
  #pv-file .md pre { background: var(--bg3); border-radius: 4px; }
  #pv-file .md code { background: var(--bg3); padding: 0 3px; border-radius: 3px; }
  #pv-file .md a { color: var(--accent); }
  #pv-file img { max-width: 100%; padding: 8px; }
  #pv-file .note { padding: 14px; color: var(--dim); }
  #pv-app .bar { display: flex; gap: 4px; padding: 4px 6px; border-bottom: 1px solid var(--line);
    flex: 0 0 auto; }
  #pv-app .bar input { flex: 1; font: inherit; background: var(--bg); color: var(--fg);
    border: 1px solid var(--line); border-radius: 4px; padding: 3px 7px; min-width: 0; }
  #pv-app .bar button { font: inherit; background: var(--bg3); color: var(--dim);
    border: 1px solid var(--line); border-radius: 4px; cursor: pointer; padding: 0 8px; }
  #pv-app .bar button:hover { color: var(--fg); }
  #pv-app .bar button.on { color: var(--fg); background: #4a3a1a; border-color: #7a5f2a; }
  #pv-pagetabs { display: none; gap: 2px; padding: 3px 6px 0; flex: 0 0 auto; }
  #pv-pagetabs.has { display: flex; }
  #pv-pagetabs .ptab { display: flex; align-items: center; gap: 5px; padding: 2px 8px;
    background: var(--bg3); border: 1px solid var(--line); border-radius: 4px 4px 0 0;
    color: var(--dim); cursor: pointer; max-width: 150px; font-size: 11px; }
  #pv-pagetabs .ptab.on { color: var(--fg); border-color: #35507a; background: #1a2436; }
  #pv-pagetabs .ptab span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #pv-pagetabs .ptab b { cursor: pointer; font-weight: 400; }
  #pv-appbody { flex: 1; min-height: 0; position: relative; }
  #pv-app .placeholder { position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; color: var(--dim); text-align: center; padding: 0 20px; }
  /* ---- extra terminals under the preview ---- */
  #pv-shells { flex: 0 0 auto; border-top: 1px solid var(--line); display: none;
    flex-direction: column; height: 220px; }
  #pv-shells.open { display: flex; }
  #pv-shells .shhdr { display: flex; gap: 2px; align-items: center; padding: 3px 6px;
    background: var(--bg3); flex: 0 0 auto; }
  #pv-shells .shhdr .stab { padding: 1px 9px; border: 1px solid var(--line); border-radius: 4px;
    color: var(--dim); cursor: pointer; font-size: 11px; background: var(--bg2); }
  #pv-shells .shhdr .stab.on { color: var(--fg); background: #24304a; border-color: #35507a; }
  #pv-shells .shhdr button { background: none; border: none; color: var(--dim); cursor: pointer; }
  #pv-shells .shhdr button:hover { color: var(--fg); }
  #pv-shells .shbody { flex: 1; min-height: 0; position: relative; background: var(--bg); }
  #pv-shells .shbody .termbox { padding: 2px 0 0 4px; }
  #shellToggle { margin-left: auto; }
  #pv-feed .list { flex: 1; overflow: auto; padding: 4px 0; }
  .feed-item { display: flex; align-items: center; gap: 7px; padding: 4px 9px;
    cursor: pointer; border-bottom: 1px solid #1b1b22; }
  .feed-item:hover { background: #20202a; }
  .feed-item .what { flex: 1; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; }
  .feed-item .t { color: var(--dim); flex: 0 0 auto; font-size: 10.5px; }
  .feed-item .open { border: 1px solid var(--line); background: none; color: var(--dim);
    border-radius: 3px; cursor: pointer; font-size: 10.5px; padding: 1px 6px; }
  .feed-item .open:hover { color: var(--fg); }
  .feed-empty { padding: 16px; color: var(--dim); text-align: center; }
  #rv-count:not(:empty) { background: var(--changed); color: #1a1508; border-radius: 8px;
    padding: 0 6px; font-size: 10px; font-weight: 600; margin-left: 3px; }
  #pv-review .list { flex: 1; overflow: auto; padding: 4px 0; }
  .task { border-bottom: 1px solid #1b1b22; }
  .task > .thead { display: flex; align-items: baseline; gap: 8px; padding: 7px 9px 5px;
    cursor: pointer; }
  .task > .thead:hover { background: #20202a; }
  .task .tprompt { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-size: 12px; }
  .task.done .tprompt { color: var(--dim); }
  .task .tt { color: var(--dim); font-size: 10.5px; flex: 0 0 auto; }
  .task .tbadge { background: var(--changed); color: #1a1508; border-radius: 8px;
    padding: 0 6px; font-size: 10px; font-weight: 600; }
  .task .tok { color: #7fae7f; font-size: 11px; }
  .task .tfiles { padding: 0 0 5px; }
  .task .tfile { display: flex; align-items: center; gap: 7px; padding: 2px 9px 2px 22px;
    cursor: pointer; font-size: 11.5px; }
  .task .tfile:hover { background: #20202a; }
  .task .tfile .dot { width: 6px; height: 6px; border-radius: 50%; flex: 0 0 auto; }
  .task .tfile.unseen .dot { background: var(--changed); }
  .task .tfile.seen .dot { background: #7fae7f; }
  .task .tfile span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .task .tmark { margin: 2px 9px 6px 22px; font: inherit; font-size: 10.5px; padding: 2px 9px;
    background: var(--bg3); color: var(--dim); border: 1px solid var(--line); border-radius: 4px;
    cursor: pointer; }
  .task .tmark:hover { color: var(--fg); }

  /* ---- status bar ---- */
  #status { grid-area: stat; display: flex; align-items: center; gap: 16px;
    padding: 0 10px; background: var(--bg2); border-top: 1px solid var(--line);
    font-family: "Cascadia Mono", Consolas, monospace; font-size: 11px; color: var(--dim);
    white-space: nowrap; overflow: hidden; }
  #status .seg b { color: var(--fg); font-weight: 600; }
  #status.stale { opacity: .45; }
  #status .spacer { flex: 1; }
  #status .warn { color: var(--changed); }
</style>
</head>
<body>
<div id="app">
  <div id="tabs"></div>
  <div id="tree"></div>
  <div id="s1" class="split"></div>
  <div id="termhost"></div>
  <div id="s2" class="split"></div>
  <div id="preview">
    <div id="pv-modes">
      <button data-mode="file">File</button>
      <button data-mode="app">App</button>
      <button data-mode="review">Review <span id="rv-count"></span></button>
      <button data-mode="feed">Feed</button>
      <button id="shellToggle" title="Terminals under the preview">⌨</button>
    </div>
    <div id="pv-body">
      <div id="pv-file" class="pv-view"></div>
      <div id="pv-app" class="pv-view">
        <div class="bar">
          <input id="pv-url" placeholder="http://localhost:5173" spellcheck="false" />
          <button id="pv-go" title="Load">Go</button>
          <button id="pv-reload" title="Reload">⟳</button>
          <button id="pv-pick" title="Select an element, Claude gets told where to look">🎯</button>
          <button id="pv-ann" title="Draw annotation boxes on the page">✏️</button>
          <button id="pv-send" title="Send annotated screenshot to Claude" style="display:none">Send</button>
          <button id="pv-ext" title="Open in browser">↗</button>
        </div>
        <div id="pv-pagetabs"></div>
        <div id="pv-appbody">
          <div class="placeholder">No app loaded.<br/>Localhost links Claude starts or mentions land in the Feed; tap one to open it here.</div>
        </div>
      </div>
      <div id="pv-feed" class="pv-view"><div class="list"></div></div>
      <div id="pv-review" class="pv-view"><div class="list"></div></div>
    </div>
    <div id="pv-shells">
      <div class="shhdr"><span id="sh-tabs" style="display:flex;gap:2px"></span><button id="sh-add" title="New terminal">+</button><button id="sh-close" title="Hide terminals" style="margin-left:auto">▾</button></div>
      <div class="shbody" id="sh-body"></div>
    </div>
  </div>
  <div id="status"><span class="seg">no session</span></div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
