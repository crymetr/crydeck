[package]
name = "crydeck"
version = "0.8.0"
description = "A lightweight Windows desktop shell for Claude Code"
authors = ["Sait Askar"]
license = "MIT"
repository = "https://github.com/saitaskar/crydeck"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["unstable"] }
image = { version = "0.25", default-features = false, features = ["png"] }
tauri-plugin-log = "2"
portable-pty = "0.9"
tiny_http = "0.12"
rfd = "0.15"
notify = "7"
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_System_IO",
  "Win32_Graphics_Gdi",
] }
